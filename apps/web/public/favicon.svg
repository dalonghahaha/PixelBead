<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>PixelBead</title>
  <!--
    PixelBead favicon — 16×16 拼豆 grid 风格 "P" 字母
    蓝色主身 + 4 色珠子内部装饰(橙/黄/绿/粉)
    大龙随时可用定稿替换: 直接覆盖此文件即可,Header / Footer / og.png 自动跟随。
    原始 8×8 版本(commit f6ed678)体积更小但 16px 显示有锯齿,此版本升级。
  -->
  <!-- P 外轮廓(主身) -->
  <rect x="3" y="2" width="6" height="2" fill="#0369a1"/>
  <rect x="3" y="4" width="2" height="7" fill="#0369a1"/>
  <rect x="3" y="7" width="6" height="2" fill="#0369a1"/>
  <rect x="9" y="4" width="2" height="3" fill="#0369a1"/>
  <!-- 彩色珠子内部(4 色) -->
  <rect x="5" y="4" width="2" height="1" fill="#fb923c"/>
  <rect x="7" y="4" width="2" height="1" fill="#fbbf24"/>
  <rect x="5" y="5" width="2" height="1" fill="#22c55e"/>
  <rect x="7" y="5" width="2" height="1" fill="#ec4899"/>
  <rect x="5" y="6" width="2" height="1" fill="#fbbf24"/>
  <rect x="7" y="6" width="2" height="1" fill="#fb923c"/>
  <!-- P 立柱底部延伸至 baseline -->
  <rect x="3" y="9" width="2" height="2" fill="#0369a1"/>
  <!-- 装饰小珠:底部一颗粉色"脚" -->
  <rect x="6" y="11" width="1" height="1" fill="#ec4899"/>
  <rect x="9" y="11" width="1" height="1" fill="#fbbf24"/>
</svg>