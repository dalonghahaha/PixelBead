version: "3.9"

services:
  postgres:
    image: postgres:14-alpine
    container_name: pixelbead-postgres
    environment:
      POSTGRES_USER: pixelbead
      POSTGRES_PASSWORD: pixelbead_dev_pwd
      POSTGRES_DB: pixelbead
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelbead"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:6-alpine
    container_name: pixelbead-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pixelbead-api
    environment:
      DATABASE_URL: postgresql+psycopg://pixelbead:pixelbead_dev_pwd@postgres:5432/pixelbead
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me_in_production_12345678}
      CORS_ORIGINS: http://localhost:3000
      STORAGE_DIR: /app/storage
    ports:
      - "8000:8000"
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: pixelbead-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  api_storage:

  # ← 010 异步任务 worker 服务
  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: pixelbead-worker
    command: python -m app.workers.generate_worker
    environment:
      DATABASE_URL: postgresql+psycopg://pixelbead:pixelbead_dev_pwd@postgres:5432/pixelbead
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /app/storage
      WORKER_CONCURRENCY: "2"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENV: ${SENTRY_ENV:-production}
    volumes:
      - api_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
